<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="pop-up_registrazione.css">
    <title>Accedi — Cinema Mood</title>
</head>

<body>

<main>
    <div class="overlay" id="overlay">
        <div class="pop-up-contenuto">

            <!-- HEADER CON LOGO -->
            <div class="popup-header">
                <div class="immagine-logo">
                    <img src="logo.png" alt="Cinema Mood">
                </div>
                <span class="chiudi" id="chiudi">&times;</span>
            </div>

            <!-- CORPO -->
            <div class="popup-body">

                <!-- TABS -->
                <div class="tab-switcher">
                    <button class="tab-btn attivo" id="tab-accedi" onclick="mostraTab('accedi')">Accedi</button>
                    <button class="tab-btn" id="tab-registrati" onclick="mostraTab('registrati')">Registrati</button>
                </div>

                <!-- ===== PANNELLO LOGIN ===== -->
                <div class="pannello attivo" id="pannello-accedi">

                    <p class="testo-log-in">Bentornato a Cinema Mood</p>

                    <!-- Email -->
                    <div class="campo">
                        <span class="icona-campo">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>
                        </span>
                        <input type="email" id="login-email" placeholder=" " required>
                        <label for="login-email">Indirizzo email</label>
                    </div>

                    <!-- Password -->
                    <div class="campo">
                        <span class="icona-campo">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                            </svg>
                        </span>
                        <input type="password" id="login-pwd" placeholder=" " required>
                        <label for="login-pwd">Password</label>
                        <span class="show-pass" id="toggle-login-pwd">
                            <svg id="icon-eye-login" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </span>
                    </div>

                    <!-- Recupero password -->
                    <a href="recupero_pswd.html" class="link-recupero-pswd">Password dimenticata?</a>

                    <!-- Messaggio errore login -->
                    <p class="msg-errore" id="errore-login"></p>

                    <!-- Bottone accedi -->
                    <button class="btn-login" id="btn-accedi">Accedi</button>

                    <!-- Separatore -->
                    <div class="linea-con-testo">
                        <hr><span>oppure</span><hr>
                    </div>

                    <!-- Continua con Google -->
                    <button class="btn-google" onclick="window.location.href='accedi_google.html'">
                        <svg width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#FBBC05" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#4285F4" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Continua con Google
                    </button>

                </div>

                <!-- ===== PANNELLO REGISTRAZIONE ===== -->
                <div class="pannello" id="pannello-registrati">

                    <p class="testo-log-in">Crea il tuo account</p>

                    <!-- Nome -->
                    <div class="campo">
                        <span class="icona-campo">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                            </svg>
                        </span>
                        <input type="text" id="reg-nome" placeholder=" " required>
                        <label for="reg-nome">Nome e cognome</label>
                    </div>

                    <!-- Email -->
                    <div class="campo">
                        <span class="icona-campo">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                            </svg>
                        </span>
                        <input type="email" id="reg-email" placeholder=" " required>
                        <label for="reg-email">Indirizzo email</label>
                    </div>

                    <!-- Password -->
                    <div class="campo">
                        <span class="icona-campo">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                            </svg>
                        </span>
                        <input type="password" id="reg-pwd" placeholder=" " required>
                        <label for="reg-pwd">Password</label>
                        <span class="show-pass" id="toggle-reg-pwd">
                            <svg id="icon-eye-reg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </span>
                    </div>

                    <!-- Conferma password -->
                    <div class="campo">
                        <span class="icona-campo">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                            </svg>
                        </span>
                        <input type="password" id="reg-pwd-confirm" placeholder=" " required>
                        <label for="reg-pwd-confirm">Conferma password</label>
                    </div>

                    <!-- Messaggio errore registrazione -->
                    <p class="msg-errore" id="errore-registrazione"></p>

                    <!-- Bottone registrati -->
                    <button class="btn-login" id="btn-crea-account" style="margin-top: 8px;">Crea account</button>

                    <!-- Separatore -->
                    <div class="linea-con-testo">
                        <hr><span>oppure</span><hr>
                    </div>

                    <!-- Continua con Google -->
                    <button class="btn-google" onclick="window.location.href='accedi_google.html'">
                        <svg width="18" height="18" viewBox="0 0 48 48">
                            <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                            <path fill="#FBBC05" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                            <path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                            <path fill="#4285F4" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                        </svg>
                        Registrati con Google
                    </button>

                </div>

            </div><!-- /popup-body -->
        </div><!-- /pop-up-contenuto -->
    </div><!-- /overlay -->
</main>

<style>
    /* Messaggio errore inline */
    .msg-errore {
        font-size: 12px;
        color: #ff4d6d;
        text-align: center;
        min-height: 18px;
        margin-bottom: 10px;
        font-family: 'Georgia', serif;
        letter-spacing: 0.3px;
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const overlay = document.getElementById("overlay");
    const chiudi  = document.getElementById("chiudi");

    /* -------- Chiudi popup -------- */
    function closePopup() {
        overlay.classList.add("closing");
        setTimeout(() => overlay.style.display = "none", 300);
    }
    chiudi.addEventListener("click", closePopup);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closePopup(); });

    /* -------- Tabs -------- */
    window.mostraTab = function (quale) {
        document.querySelectorAll(".pannello").forEach(p => p.classList.remove("attivo"));
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("attivo"));
        document.getElementById("pannello-" + quale).classList.add("attivo");
        document.getElementById("tab-" + quale).classList.add("attivo");
    };

    /* -------- Mostra / Nascondi password -------- */
    setupTogglePassword("toggle-login-pwd", "login-pwd", "icon-eye-login");
    setupTogglePassword("toggle-reg-pwd",   "reg-pwd",   "icon-eye-reg");

    function setupTogglePassword(toggleId, inputId, iconId) {
        const toggle = document.getElementById(toggleId);
        const input  = document.getElementById(inputId);
        const icon   = document.getElementById(iconId);
        if (!toggle || !input) return;
        toggle.addEventListener("click", function () {
            const isPassword = input.type === "password";
            input.type = isPassword ? "text" : "password";
            icon.innerHTML = isPassword
                ? `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46A11.8 11.8 0 0 0 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>`
                : `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
        });
    }

    /* ======================================================
       LOGIN
    ====================================================== */
    document.getElementById("btn-accedi").addEventListener("click", async function () {
        const email    = document.getElementById("login-email").value.trim();
        const password = document.getElementById("login-pwd").value;
        const erroreEl = document.getElementById("errore-login");

        erroreEl.textContent = "";

        // Validazione frontend (veloce, prima di chiamare il server)
        if (!email || !password) {
            erroreEl.textContent = "Compila tutti i campi.";
            return;
        }

        try {
            const risposta = await fetch("api/login.php", {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify({ email, password })
            });

            const dati = await risposta.json();

            if (dati.successo) {
                // Login riuscito → chiudi popup e vai alla home
                closePopup();
                window.location.href = "main.html";
            } else {
                erroreEl.textContent = dati.errore;
            }
        } catch (err) {
            erroreEl.textContent = "Errore di connessione. Riprova.";
        }
    });

    /* ======================================================
       REGISTRAZIONE
    ====================================================== */
    document.getElementById("btn-crea-account").addEventListener("click", async function () {
        const nome     = document.getElementById("reg-nome").value.trim();
        const email    = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-pwd").value;
        const conferma = document.getElementById("reg-pwd-confirm").value;
        const erroreEl = document.getElementById("errore-registrazione");

        erroreEl.textContent = "";

        // Validazione frontend
        if (!nome || !email || !password || !conferma) {
            erroreEl.textContent = "Compila tutti i campi.";
            return;
        }

        if (password !== conferma) {
            erroreEl.textContent = "Le password non coincidono.";
            return;
        }

        if (password.length < 6) {
            erroreEl.textContent = "La password deve essere di almeno 6 caratteri.";
            return;
        }

        try {
            const risposta = await fetch("api/registrazione.php", {
                method:  "POST",
                headers: { "Content-Type": "application/json" },
                body:    JSON.stringify({ nome, email, password })
            });

            const dati = await risposta.json();

            if (dati.successo) {
                // Registrazione riuscita → vai alla home
                window.location.href = "main.html";
            } else {
                erroreEl.textContent = dati.errore;
            }
        } catch (err) {
            erroreEl.textContent = "Errore di connessione. Riprova.";
        }
    });

});
</script>

</body>
</html>
