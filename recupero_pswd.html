<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recupera Password — Cinema Mood</title>
    <style>
        @font-face {
            font-family: 'Stronger-Thinker-Bold';
            src: url('Stronger-Thinker-Bold.ttf');
        }

        :root {
            --burgundy:       #800020;
            --burgundy-dark:  #5e0015;
            --burgundy-deep:  #3a000d;
            --burgundy-light: #bb2248;
            --burgundy-glow:  rgba(128, 0, 32, 0.4);
            --rose:           #ff4d6d;
            --cream:          #f5e6ea;
            --text-main:      #faeef1;
            --text-muted:     rgba(250, 238, 241, 0.55);
            --bg:             #0d0508;
            --border:         rgba(128, 0, 32, 0.35);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(128, 0, 32, 0.18) 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(160deg, rgba(94, 0, 21, 0.18) 0%, rgba(10, 2, 5, 0.95) 40%);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 40px 80px rgba(0,0,0,0.8), 0 0 0 1px rgba(187,34,72,0.1) inset, 0 1px 0 rgba(255,100,130,0.15) inset;
            animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header {
            background: linear-gradient(90deg, var(--burgundy-deep) 0%, var(--burgundy-dark) 40%, var(--burgundy) 60%, var(--burgundy-dark) 80%, var(--burgundy-deep) 100%);
            padding: 26px 30px 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            position: relative;
        }
        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,100,120,0.4), transparent);
        }
        .card-header img { height: 64px; width: auto; filter: drop-shadow(0 0 14px rgba(255,77,109,0.3)); }

        .card-body { padding: 32px 36px 36px; }

        .icona-centrale { display: flex; justify-content: center; margin-bottom: 20px; animation: fadeUp 0.5s ease 0.2s both; }
        .icona-centrale .cerchio {
            width: 64px; height: 64px; border-radius: 50%;
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 30px rgba(128,0,32,0.5);
        }

        .titolo {
            font-family: 'Stronger-Thinker-Bold'; font-size: 13px; letter-spacing: 3px;
            text-transform: uppercase; color: var(--text-main); text-align: center;
            margin-bottom: 10px; animation: fadeUp 0.5s ease 0.25s both;
        }
        .sottotitolo {
            font-size: 14px; color: var(--text-muted); text-align: center;
            line-height: 1.65; margin-bottom: 28px; animation: fadeUp 0.5s ease 0.3s both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .campo { position: relative; margin-bottom: 20px; animation: fadeUp 0.5s ease 0.35s both; }
        .campo input {
            width: 100%; padding: 14px 16px 14px 44px;
            background: rgba(128,0,32,0.08); border: 1px solid var(--border);
            border-radius: 10px; font-family: 'Georgia', serif; font-size: 14px;
            color: var(--text-main); outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        .campo input::placeholder { color: rgba(250,238,241,0.28); }
        .campo input:focus {
            border-color: var(--burgundy-light); background: rgba(128,0,32,0.14);
            box-shadow: 0 0 0 3px rgba(128,0,32,0.15);
        }
        .campo label {
            position: absolute; left: 44px; top: 50%; transform: translateY(-50%);
            font-family: 'Stronger-Thinker-Bold'; font-size: 11px; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--text-muted);
            pointer-events: none; transition: all 0.22s ease;
        }
        .campo input:focus + label,
        .campo input:not(:placeholder-shown) + label {
            top: 0; left: 14px; font-size: 9px; color: var(--burgundy-light);
            background: var(--bg); padding: 0 5px; border-radius: 3px;
        }
        .icona-campo {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            color: var(--text-muted); display: flex; align-items: center;
            pointer-events: none; transition: color 0.2s ease;
        }
        .campo:focus-within .icona-campo { color: var(--rose); }

        .msg-errore {
            display: none; font-size: 12px; color: var(--rose); text-align: center;
            margin-bottom: 14px; font-family: 'Stronger-Thinker-Bold'; letter-spacing: 1px;
        }
        .msg-errore.visibile { display: block; }

        .btn-primario {
            width: 100%; padding: 13px; border: none;
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
            color: white; font-family: 'Stronger-Thinker-Bold'; font-size: 11px;
            letter-spacing: 2.5px; text-transform: uppercase; border-radius: 10px;
            cursor: pointer; position: relative; overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 20px; animation: fadeUp 0.5s ease 0.4s both;
        }
        .btn-primario::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,150,170,0.4), transparent);
        }
        .btn-primario:hover { transform: translateY(-2px); box-shadow: 0 8px 24px var(--burgundy-glow); }
        .btn-primario:active { transform: translateY(0); }
        .btn-primario:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .link-torna {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            font-family: 'Stronger-Thinker-Bold'; font-size: 10px; letter-spacing: 1.5px;
            text-transform: uppercase; color: var(--text-muted); text-decoration: none;
            transition: color 0.2s ease; animation: fadeUp 0.5s ease 0.45s both;
        }
        .link-torna:hover { color: var(--rose); }
        .link-torna:hover svg { transform: translateX(-3px); }
        .link-torna svg { transition: transform 0.2s ease; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <img src="logo.png" alt="Cinema Mood">
    </div>

    <div class="card-body">

        <div class="icona-centrale">
            <div class="cerchio">
                <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
            </div>
        </div>

        <p class="titolo">Recupera la tua password</p>
        <p class="sottotitolo">Inserisci l'indirizzo email del tuo account.<br>Ti invieremo un link per reimpostare la password.</p>

        <div class="campo">
            <span class="icona-campo">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
            </span>
            <input type="email" id="email-recupero" placeholder=" " required>
            <label for="email-recupero">Indirizzo email</label>
        </div>

        <p class="msg-errore" id="msg-errore">Inserisci un indirizzo email valido.</p>

        <button class="btn-primario" id="btn-invia">Invia link di recupero</button>

        <a href="pop-up_registrazione.html" class="link-torna">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Torna al login
        </a>

    </div>
</div>
 
<script>
    // poiché <script> è dopo </html> il DOM si è già caricato, quindi non è necessario
    // fare document.addEventListener("DOMContentLoaded", function(){})
document.getElementById("btn-invia").addEventListener("click", async function () {
    const email   = document.getElementById("email-recupero").value.trim();
    const errore  = document.getElementById("msg-errore");
    const btnInvia = document.getElementById("btn-invia");

    // Validazione frontend
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    if (!emailRegex.test(email)) {
        errore.textContent = "Inserisci un indirizzo email valido.";
        errore.classList.add("visibile");
        return;
    }

    errore.classList.remove("visibile");
    btnInvia.disabled = true;
    btnInvia.textContent = "Invio in corso…";

    try {
        const risposta = await fetch("api/recupero_password.php", {
            method:  "POST",
            headers: { "Content-Type": "application/json" },
            body:    JSON.stringify({ email })
        });

        const dati = await risposta.json();

        if (dati.successo) {
            // Salva l'email per mostrarla nella pagina di conferma
            sessionStorage.setItem("emailRecupero", email);
            window.location.href = "recupero_pswd_inviata.html";
        } else {
            errore.textContent = dati.errore || "Si è verificato un errore.";
            errore.classList.add("visibile");
            btnInvia.disabled = false;
            btnInvia.textContent = "Invia link di recupero";
        }
    } catch (err) {
        errore.textContent = "Errore di connessione. Riprova.";
        errore.classList.add("visibile");
        btnInvia.disabled = false;
        btnInvia.textContent = "Invia link di recupero";
    }
});

document.getElementById("email-recupero").addEventListener("input", function () {
    document.getElementById("msg-errore").classList.remove("visibile");
});
</script>

</body>
</html>
