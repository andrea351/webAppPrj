<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connessione Google — Cinema Mood</title>
    <style>
        @font-face {
            font-family: 'Stronger-Thinker-Bold';
            src: url('Stronger-Thinker-Bold.ttf');
        }

        :root {
            --burgundy:       #800020;
            --burgundy-dark:  #5e0015;
            --burgundy-deep:  #3a000d;
            --burgundy-light: #bb2248;
            --burgundy-glow:  rgba(128, 0, 32, 0.4);
            --rose:           #ff4d6d;
            --text-main:      #faeef1;
            --text-muted:     rgba(250, 238, 241, 0.55);
            --bg:             #0d0508;
            --border:         rgba(128, 0, 32, 0.35);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(128, 0, 32, 0.18) 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* ===== CARD ===== */
        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(160deg, rgba(94, 0, 21, 0.18) 0%, rgba(10, 2, 5, 0.95) 40%);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(187, 34, 72, 0.1) inset,
                0 1px 0 rgba(255, 100, 130, 0.15) inset;
            animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== HEADER ===== */
        .card-header {
            background: linear-gradient(90deg, var(--burgundy-deep) 0%, var(--burgundy-dark) 40%, var(--burgundy) 60%, var(--burgundy-dark) 80%, var(--burgundy-deep) 100%);
            padding: 26px 30px 22px;
            display: flex;
            justify-content: center;
            position: relative;
        }

        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 120, 0.4), transparent);
        }

        .card-header img {
            height: 64px;
            width: auto;
            filter: drop-shadow(0 0 14px rgba(255, 77, 109, 0.3));
        }

        /* ===== BODY ===== */
        .card-body {
            padding: 40px 36px 44px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ===== LOGO + CONNESSIONE ===== */
        .connessione-loghi {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 32px;
            animation: fadeUp 0.5s ease 0.15s both;
        }

        .logo-cerchio {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .logo-cerchio.cinema {
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
            box-shadow: 0 0 24px rgba(128, 0, 32, 0.5);
        }

        .logo-cerchio.google {
            background: #ffffff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.35);
        }

        /* Frecce animate tra i loghi */
        .frecce {
            display: flex;
            flex-direction: column;
            gap: 5px;
            opacity: 0;
            animation: fadeIn 0.4s ease 0.5s forwards;
        }

        .freccia {
            width: 28px;
            height: 2px;
            border-radius: 2px;
            position: relative;
            overflow: hidden;
        }

        .freccia::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, var(--rose), transparent);
            animation: scorri 1.4s ease-in-out infinite;
        }

        .freccia:nth-child(2)::after { animation-delay: 0.25s; }
        .freccia:nth-child(3)::after { animation-delay: 0.5s; }

        @keyframes scorri {
            0%   { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* ===== TESTO ===== */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .titolo {
            font-family: 'Stronger-Thinker-Bold';
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 10px;
            animation: fadeUp 0.5s ease 0.25s both;
        }

        .sottotitolo {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.65;
            margin-bottom: 36px;
            animation: fadeUp 0.5s ease 0.3s both;
        }

        /* ===== BARRA AVANZAMENTO ===== */
        .progress-wrap {
            width: 100%;
            margin-bottom: 12px;
            animation: fadeUp 0.5s ease 0.35s both;
        }

        .progress-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(128, 0, 32, 0.2);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--burgundy-dark), var(--rose));
            border-radius: 3px;
            transition: width 0.4s ease;
        }

        .progress-label {
            font-family: 'Stronger-Thinker-Bold';
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 10px;
            min-height: 16px;
            animation: fadeUp 0.5s ease 0.38s both;
        }

        /* ===== LINK ANNULLA ===== */
        .link-annulla {
            margin-top: 28px;
            font-family: 'Stronger-Thinker-Bold';
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
            animation: fadeUp 0.5s ease 0.5s both;
        }

        .link-annulla:hover { color: var(--rose); }
    </style>
</head>
<body>

<div class="card">

    <div class="card-header">
        <img src="logo.png" alt="Cinema Mood">
    </div>

    <div class="card-body">

        <!-- Loghi Cinema Mood ↔ Google -->
        <div class="connessione-loghi">
            <!-- Logo Cinema Mood -->
            <div class="logo-cerchio cinema">
                <svg viewBox="0 0 24 24" width="26" height="26" fill="white">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/>
                </svg>
            </div>

            <!-- Frecce animate -->
            <div class="frecce">
                <div class="freccia" style="background: rgba(128,0,32,0.15);"></div>
                <div class="freccia" style="background: rgba(128,0,32,0.15);"></div>
                <div class="freccia" style="background: rgba(128,0,32,0.15);"></div>
            </div>

            <!-- Logo Google -->
            <div class="logo-cerchio google">
                <svg width="26" height="26" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#FBBC05" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#34A853" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#4285F4" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
            </div>
        </div>

        <p class="titolo">Connessione in corso</p>
        <p class="sottotitolo">Stiamo verificando il tuo account Google.<br>Non chiudere questa finestra.</p>

        <!-- Barra avanzamento -->
        <div class="progress-wrap">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="barra"></div>
            </div>
        </div>
        <p class="progress-label" id="progress-label">Avvio connessione…</p>

        <a href="pop-up_registrazione.html" class="link-annulla">Annulla</a>

    </div>
</div>

<script>
    const barra  = document.getElementById("barra");
    const label  = document.getElementById("progress-label");

    const steps = [
        { pct: 20,  msg: "Avvio connessione…",           delay: 300  },
        { pct: 45,  msg: "Verifica credenziali Google…",  delay: 900  },
        { pct: 70,  msg: "Recupero profilo…",             delay: 1800 },
        { pct: 90,  msg: "Quasi pronto…",                 delay: 2700 },
        { pct: 100, msg: "Accesso completato ✓",          delay: 3400 },
    ];

    steps.forEach(({ pct, msg, delay }) => {
        setTimeout(() => {
            barra.style.width = pct + "%";
            label.textContent = msg;
        }, delay);
    });

    // Dopo il completamento reindirizza alla home
    setTimeout(() => {
        window.location.href = "main.html";
    }, 4200);
</script>

</body>
</html>
