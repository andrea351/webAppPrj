<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Inviata — Cinema Mood</title>
    <style>
        @font-face {
            font-family: 'Stronger-Thinker-Bold';
            src: url('Stronger-Thinker-Bold.ttf');
        }

        :root {
            --burgundy:       #800020;
            --burgundy-dark:  #5e0015;
            --burgundy-deep:  #3a000d;
            --burgundy-light: #bb2248;
            --burgundy-glow:  rgba(128, 0, 32, 0.4);
            --rose:           #ff4d6d;
            --text-main:      #faeef1;
            --text-muted:     rgba(250, 238, 241, 0.55);
            --bg:             #0d0508;
            --border:         rgba(128, 0, 32, 0.35);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Georgia', serif;
            background-color: var(--bg);
            background-image:
                radial-gradient(ellipse 80% 50% at 50% -10%, rgba(128, 0, 32, 0.18) 0%, transparent 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(160deg, rgba(94, 0, 21, 0.18) 0%, rgba(10, 2, 5, 0.95) 40%);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 40px 80px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(187, 34, 72, 0.1) inset,
                0 1px 0 rgba(255, 100, 130, 0.15) inset;
            animation: slideIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-24px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        .card-header {
            background: linear-gradient(90deg, var(--burgundy-deep) 0%, var(--burgundy-dark) 40%, var(--burgundy) 60%, var(--burgundy-dark) 80%, var(--burgundy-deep) 100%);
            padding: 26px 30px 22px;
            /*mette al centro il logo*/
            display: flex;
            justify-content: center;
            position: relative;
        }

        /*linea di separazione (1px)*/
        .card-header::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 100, 120, 0.4), transparent);
        }

        .card-header img {
            height: 64px;
            width: auto;
            filter: drop-shadow(0 0 14px rgba(255, 77, 109, 0.3));
        }

        .card-body {
            padding: 36px 36px 38px;
            display: flex;
            /*workflow : colonna*/
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* ===== ANIMAZIONE BUSTA ===== */
        .busta-wrapper {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            animation: fadeUp 0.5s ease 0.15s both;
        }

        .cerchio-busta {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 40px rgba(128, 0, 32, 0.5);
            animation: pulse 2.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 30px rgba(128, 0, 32, 0.4); }
            50%       { box-shadow: 0 0 55px rgba(187, 34, 72, 0.65); }
        }

        /* ✅ spunta in alto a destra */
        .badge-ok {
            position: absolute;
            top: 2px;
            right: 2px;
            width: 22px;
            height: 22px;
            background: #2ecc71;
            border-radius: 50%;
            border: 2px solid var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) 0.6s both;
        }
 
        @keyframes popIn {
            from { opacity: 0; transform: scale(0); }
            to   { opacity: 1; transform: scale(1); }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .titolo {
            font-family: 'Stronger-Thinker-Bold';
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 12px;
            animation: fadeUp 0.5s ease 0.25s both;
        }

        .sottotitolo {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.7;
            margin-bottom: 8px;
            animation: fadeUp 0.5s ease 0.3s both;
        }

        .email-evidenziata {
            display: inline-block;
            color: var(--rose);
            font-style: italic;
            animation: fadeUp 0.5s ease 0.35s both;
            margin-bottom: 28px;
            font-size: 14px;
            word-break: break-all;
        }

        /* ===== DIVISORE ===== */
        .divisore {
            width: 100%;
            border: none;
            border-top: 1px solid rgba(128, 0, 32, 0.25);
            margin-bottom: 22px;
            animation: fadeUp 0.5s ease 0.38s both;
        }

        /* ===== NOTA ===== */
        .nota {
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 24px;
            animation: fadeUp 0.5s ease 0.4s both;
        }

        .nota strong {
            color: rgba(250, 238, 241, 0.75);
        }

        /* ===== BOTTONI ===== */
        .btn-primario {
            width: 100%;
            padding: 13px;
            border: none;
            background: linear-gradient(135deg, var(--burgundy-dark), var(--burgundy));
            color: white;
            font-family: 'Stronger-Thinker-Bold';
            font-size: 11px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            border-radius: 10px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-bottom: 12px;
            animation: fadeUp 0.5s ease 0.44s both;
            text-decoration: none;
            display: block;
            text-align: center;
        }

        .btn-primario::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 150, 170, 0.4), transparent);
        }

        .btn-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--burgundy-glow);
        }

        .link-torna {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-family: 'Stronger-Thinker-Bold';
            font-size: 10px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
            animation: fadeUp 0.5s ease 0.48s both;
        }

        .link-torna:hover { color: var(--rose); }
        .link-torna:hover svg { transform: translateX(-3px); }
        .link-torna svg { transition: transform 0.2s ease; }

        /* Countdown reinvio */
        #reinvia-wrap {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            animation: fadeUp 0.5s ease 0.42s both;
        }

        #btn-reinvia {
            background: none;
            border: none;
            color: var(--rose);
            font-family: 'Stronger-Thinker-Bold';
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            padding: 0;
            text-decoration: underline;
            display: none;
            transition: color 0.2s ease;
        }

        #btn-reinvia:hover { color: var(--burgundy-light); }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <img src="logo.png" alt="Cinema Mood">
    </div>

    <div class="card-body">

        <!-- Icona busta -->
        <div class="busta-wrapper">
            <div class="cerchio-busta">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="white">
                    <path d="M20 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
            </div>
            <div class="badge-ok">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="white">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
                </svg>
            </div>
        </div>

        <p class="titolo">Email inviata!</p>
        <p class="sottotitolo">Abbiamo inviato il link di recupero a:</p>
        <span class="email-evidenziata" id="email-display">—</span>

        <hr class="divisore">

        <p class="nota">
            Controlla anche la cartella <strong>spam</strong> o <strong>promozioni</strong>.<br>
            Il link è valido per <strong>30 minuti</strong>.
        </p>

        <!-- Reinvio con countdown -->
        <div id="reinvia-wrap">
            Non hai ricevuto nulla? Reinvia tra <strong id="countdown">60</strong>s
            <button id="btn-reinvia" onclick="reinvia()">Reinvia email</button>
        </div>

        <a href="pop-up_registrazione.html" class="btn-primario">Torna al login</a>

        <a href="recupero_pswd.html" class="link-torna">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            Cambia email
        </a>

    </div>
</div>

<script>
    // Mostra l'email salvata
    const email = sessionStorage.getItem("emailRecupero") || "la tua email";
    document.getElementById("email-display").textContent = email;

    // Countdown reinvio
    let secondi = 60;
    const countdownEl = document.getElementById("countdown");
    const btnReinvia  = document.getElementById("btn-reinvia");
    const reinviaWrap = document.getElementById("reinvia-wrap");

    // Decrementa i secondi
    const timer = setInterval(() => {
        secondi--;
        countdownEl.textContent = secondi;
        if (secondi <= 0) {
            clearInterval(timer);
            reinviaWrap.innerHTML = '';
            btnReinvia.style.display = "inline";
            reinviaWrap.appendChild(btnReinvia);
            btnReinvia.style.display = "inline";
        }
    }, 1000);

    function reinvia() {
        btnReinvia.textContent = "Email reinviata ✓";
        btnReinvia.disabled = true;
        btnReinvia.style.color = "#2ecc71";
        btnReinvia.style.textDecoration = "none";
        btnReinvia.style.cursor = "default";
    }
</script>

</body>
</html>
